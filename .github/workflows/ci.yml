name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build.sh   # selftest + no-network check + dmg

  # Single required check for the branch ruleset. Do not rename.
  ci-passed:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.build.result }}" = success ]'
