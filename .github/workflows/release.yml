name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build.sh "${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" build/TypingFixer-*.dmg --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
